<main class="admin-login">
  <section class="admin-login__card card">
    <header class="admin-login__intro">
      <img src="logo-fscr.png" alt="FSCR" class="brand-logo brand-logo--lg" />
      <h1>Panel de administración</h1>
      <p>Ingresa con tu usuario y contraseña de administrador.</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Usuario</span>
        <input type="text" formControlName="usuario" autocomplete="username" placeholder="Ej. admin" />
        @if (form.controls.usuario.touched && form.controls.usuario.hasError('required')) {
          <small>El usuario es obligatorio.</small>
        }
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <small>La contraseña es obligatoria.</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="alert alert--danger" role="alert">{{ errorMessage() }}</p>
      }

      <button class="btn btn--primary admin-login__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </section>
</main>
